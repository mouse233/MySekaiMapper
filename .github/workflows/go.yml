name: Go tests

on:
  push:
  pull_request:

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Build service
        run: go build -o /tmp/mysekaimapper ./cmd/mysekaimapper
