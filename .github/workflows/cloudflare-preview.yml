name: Deploy Cloudflare Pages preview

on:
  push:
    branches: [feat/go-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-feat-go-rewrite
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=mysekaimapper --branch=feat-go-rewrite

      - name: Report preview URL
        run: echo "Preview deployed to ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
